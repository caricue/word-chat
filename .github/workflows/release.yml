name: Release

on:
  push:
    tags: ["*v"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gdextension:
    name: GDExtension - ${{ matrix.os }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ninja
        run: pipx install ninja

  package-godot-plugin:
    name: Package Godot plugin
    runs-on: ubuntu-24.04

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
